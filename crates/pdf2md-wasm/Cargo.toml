[package]
name = "pdf2md-wasm"
version = "0.1.0"
edition = "2021"
authors = ["PDF2MD Core Team"]
description = "WebAssembly compilation target for in-browser, zero-cloud-cost PDF-to-Markdown extraction"
license = "MIT OR Apache-2.0"
repository = "https://github.com/phamhung075/pdf2md-core"
keywords = ["pdf", "markdown", "wasm", "webassembly", "in-browser"]
categories = ["wasm", "text-processing"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pdf2md-core = { path = "../pdf2md-core", default-features = false, features = ["wasm"] }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
