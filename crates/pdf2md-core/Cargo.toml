[package]
name = "pdf2md-core"
version = "0.1.0"
edition = "2021"
authors = ["PDF2MD Core Team"]
description = "High-performance native Rust core engine for sub-millisecond PDF-to-Markdown extraction and 2D spatial canvas geometry"
license = "BSL-1.1"
readme = "README.md"
repository = "https://github.com/phamhung075/pdf2md-core"
keywords = ["pdf", "markdown", "parser", "ocr", "table-extraction"]
categories = ["text-processing", "parser-implementations"]

[lib]
name = "pdf2md_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:js-sys"]
# `vision` enables the on-device perceptual image-hashing primitive
# (DCT-pHash + page-raster extraction) used by the commercial server's
# Vision-rescue caching layer, plus the adjacent FFI exports. It is opt-in so
# the public core / WASM builds stay dependency-light (no image codec stack).
vision = ["dep:image"]

[dependencies]
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lopdf = "0.44"
flate2 = "1.1"
crc32fast = "1.5"
# Wasm-only deps. `std::time::Instant` is unsupported (panics) on
# wasm32-unknown-unknown, so the wasm build measures durations with the JS clock
# from js-sys/wasm-bindgen instead.
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
# Perceptual image hashing (DCT-pHash) for Vision-rescue form/template
# deduplication. Only PNG + JPEG codecs are enabled; the whole stack is opt-in
# behind the `vision` feature so public/WASM builds are untouched.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
