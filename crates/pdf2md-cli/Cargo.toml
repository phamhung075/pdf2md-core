[package]
name = "pdf2md-cli"
version = "0.2.1"
edition = "2021"
authors = ["PDF2MD Core Team"]
description = "Lightning-fast native CLI tool to extract PDFs directly to Markdown and GFM tables"
license = "BSL-1.1"
repository = "https://github.com/phamhung075/pdf2md-core"
keywords = ["pdf", "markdown", "cli", "parser", "tables"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "pdf2md"
path = "src/main.rs"

[dependencies]
pdf2md-core = { path = "../pdf2md-core", default-features = false }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# Already a direct dependency (pinned in Cargo.lock), so declaring it here adds
# no new download: the integration tests parse `--json` to prove it is valid JSON.
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
