# CapRover / Docker Swarm Production Compose for Oracle Cloud Always Free ARM
# VM.Standard.A1.Flex (4 OCPU, 24 GB RAM)
# Resource Pinning: 2.0 OCPU & 3.5 GB RAM per converter to prevent starving Keycloak/PostgreSQL.

services:
  # 1. FastAPI Web Gateway & Synchronous Microservice
  markdown-extract:
    build:
      context: .
      dockerfile: Dockerfile
    image: markdown-extract-service:production
    restart: unless-stopped
    ports:
      - "${DOCLING_SERVICE_PORT:-3984}:${DOCLING_SERVICE_PORT:-3984}"
    environment:
      DOCLING_SERVICE_PORT: "${DOCLING_SERVICE_PORT:-3984}"
      DOCLING_SERVICE_HOST: "0.0.0.0"
      DOCLING_PDF_FAST_PATH: "1"
      DOCLING_EMBED_IMAGES: "1"
      DOCLING_DEV_UI: "${DOCLING_DEV_UI:-0}"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      KEYCLOAK_ENABLED: "${KEYCLOAK_ENABLED:-0}"
      KEYCLOAK_PUBLIC_KEY: "${KEYCLOAK_PUBLIC_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      VISION_API_KEY: "${VISION_API_KEY:-}"
      VISION_FALLBACK_ENABLED: "1"
      VISION_MODEL: "${VISION_MODEL:-gemini-flash-latest}"
      VISION_MAX_PAGES: "30"
      MAX_UPLOAD_SIZE_MB: "100"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-*}"
    tmpfs:
      - /dev/shm:rw,noexec,nosuid,size=1024m
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3500M
        reservations:
          cpus: "0.5"
          memory: 1024M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os,sys; port=os.environ.get('DOCLING_SERVICE_PORT','3984'); sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{port}/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 2. Redis Message Broker & Result Store
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  # 3. Celery Asynchronous Conversion Worker Fleet
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: markdown-extract-service:production
    restart: unless-stopped
    command: ["celery", "-A", "src.infrastructure.queue.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      DOCLING_PDF_FAST_PATH: "1"
      DOCLING_EMBED_IMAGES: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      VISION_API_KEY: "${VISION_API_KEY:-}"
      VISION_FALLBACK_ENABLED: "1"
      VISION_MODEL: "${VISION_MODEL:-gemini-flash-latest}"
      VISION_MAX_PAGES: "30"
    tmpfs:
      - /dev/shm:rw,noexec,nosuid,size=1024m
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3500M
        reservations:
          cpus: "0.5"
          memory: 1024M
    depends_on:
      - redis

volumes:
  redis_data:
    name: markdown_extract_redis_data
